version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - CONDENSE_MODEL=${CONDENSE_MODEL:-llama-3.3-70b-versatile}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - DATA_DIR=/data
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - pagechat_data:/data
    restart: unless-stopped

volumes:
  pagechat_data:
